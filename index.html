<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task Board</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f5f0;
        --panel: #ffffff;
        --ink: #202124;
        --muted: #646a73;
        --line: #d8d1c7;
        --accent: #176f68;
        --shadow: 0 10px 24px rgba(32, 33, 36, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: min(860px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 34px 0;
      }

      header {
        margin-bottom: 18px;
      }

      .eyebrow {
        margin: 0 0 4px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3 {
        letter-spacing: 0;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.9rem, 5vw, 3rem);
      }

      article {
        min-height: 420px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
        padding: 24px 28px;
        line-height: 1.6;
      }

      article h1,
      article h2,
      article h3 {
        margin: 1.1em 0 0.45em;
      }

      article h1:first-child,
      article h2:first-child,
      article h3:first-child {
        margin-top: 0;
      }

      article ul {
        padding-left: 1.4rem;
      }

      article li {
        margin: 0.35rem 0;
      }

      article li.task-item {
        list-style: none;
      }

      article li.task-item input {
        margin-left: -1.4rem;
      }

      article hr {
        height: 1px;
        margin: 2rem 0;
        border: 0;
        background: var(--line);
      }

      .table-wrap {
        width: 100%;
        overflow-x: auto;
        margin: 1rem 0 1.4rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.95rem;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 0.65rem 0.75rem;
        text-align: left;
        vertical-align: top;
      }

      th {
        background: #f3f5f2;
        font-weight: 700;
      }

      article code {
        border-radius: 4px;
        background: #eef1ef;
        padding: 0.1rem 0.25rem;
        font-family: Consolas, "Liberation Mono", monospace;
      }

      input[type="checkbox"] {
        margin-right: 0.35rem;
      }

      .task-complete {
        color: var(--muted);
        text-decoration: line-through;
      }

      .status {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Markdown File</p>
        <h1>Task Board</h1>
      </header>

      <article id="taskBoard" aria-live="polite">
        <p class="status">Loading task board...</p>
      </article>
    </main>

    <script>
      const taskBoard = document.querySelector("#taskBoard");

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function renderInline(markdown) {
        return escapeHtml(markdown)
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/__([^_]+)__/g, "<strong>$1</strong>")
          .replace(/_([^_]+)_/g, "<em>$1</em>")
          .replace(/\*([^*]+)\*/g, "<em>$1</em>");
      }

      function isTableSeparator(line) {
        return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
      }

      function isTableRow(line) {
        return line.trim().startsWith("|") && line.trim().endsWith("|");
      }

      function parseTableCells(line) {
        return line
          .trim()
          .replace(/^\|/, "")
          .replace(/\|$/, "")
          .split("|")
          .map((cell) => cell.trim());
      }

      function parseAlignments(separatorLine) {
        return parseTableCells(separatorLine).map((cell) => {
          const left = cell.startsWith(":");
          const right = cell.endsWith(":");

          if (left && right) {
            return "center";
          }

          if (right) {
            return "right";
          }

          return "left";
        });
      }

      function renderTable(lines, startIndex) {
        const headers = parseTableCells(lines[startIndex]);
        const alignments = parseAlignments(lines[startIndex + 1]);
        const rows = [];
        let index = startIndex + 2;

        while (index < lines.length && isTableRow(lines[index])) {
          rows.push(parseTableCells(lines[index]));
          index += 1;
        }

        const head = headers
          .map((header, cellIndex) => {
            const align = alignments[cellIndex] || "left";
            return `<th style="text-align: ${align}">${renderInline(header)}</th>`;
          })
          .join("");
        const body = rows
          .map((row) => {
            const cells = headers
              .map((_, cellIndex) => {
                const align = alignments[cellIndex] || "left";
                return `<td style="text-align: ${align}">${renderInline(row[cellIndex] || "")}</td>`;
              })
              .join("");

            return `<tr>${cells}</tr>`;
          })
          .join("");

        return {
          html: `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`,
          nextIndex: index
        };
      }

      function renderMarkdown(markdown) {
        const lines = markdown.split(/\r?\n/);
        const html = [];
        let inList = false;

        function closeList() {
          if (inList) {
            html.push("</ul>");
            inList = false;
          }
        }

        for (let index = 0; index < lines.length; index += 1) {
          const line = lines[index];

          if (!line.trim()) {
            closeList();
            continue;
          }

          if (/^\s*-{3,}\s*$/.test(line)) {
            closeList();
            html.push("<hr>");
            continue;
          }

          if (isTableRow(line) && index + 1 < lines.length && isTableSeparator(lines[index + 1])) {
            closeList();
            const table = renderTable(lines, index);
            html.push(table.html);
            index = table.nextIndex - 1;
            continue;
          }

          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) {
            closeList();
            html.push(`<h${heading[1].length}>${renderInline(heading[2])}</h${heading[1].length}>`);
            continue;
          }

          const task = line.match(/^-\s+\[( |x|X)\]\s+(.+)$/);
          if (task) {
            if (!inList) {
              html.push("<ul>");
              inList = true;
            }

            const checked = task[1].toLowerCase() === "x";
            const className = checked ? ' class="task-item task-complete"' : ' class="task-item"';
            const checkbox = `<input type="checkbox" disabled${checked ? " checked" : ""}>`;
            html.push(`<li${className}>${checkbox}${renderInline(task[2])}</li>`);
            continue;
          }

          const bullet = line.match(/^-\s+(.+)$/);
          if (bullet) {
            if (!inList) {
              html.push("<ul>");
              inList = true;
            }

            html.push(`<li>${renderInline(bullet[1])}</li>`);
            continue;
          }

          closeList();
          html.push(`<p>${renderInline(line)}</p>`);
        }

        closeList();
        return html.join("");
      }

      fetch("TASK_BOARD.md", { cache: "no-store" })
        .then((response) => {
          if (!response.ok) {
            throw new Error("Could not load TASK_BOARD.md.");
          }

          return response.text();
        })
        .then((markdown) => {
          taskBoard.innerHTML = renderMarkdown(markdown);
        })
        .catch((error) => {
          taskBoard.innerHTML = `<p class="status">${escapeHtml(error.message)}</p>`;
        });
    </script>
  </body>
</html>
